services:
  - type: web
    name: social9-forecasting
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FORECASTING_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FREE_TIER_ONLY
        value: "true"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "32768"
